<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_target | relative_url }}">
  <link rel="canonical" href="{{ page.redirect_target | absolute_url }}">
  <title>Redirecting…</title>
</head>
<body>
  <p>This page has moved to <a href="{{ page.redirect_target | relative_url }}">{{ page.redirect_label | default: 'the Tools Workspace' }}</a>.</p>
  <script>window.location.replace({{ page.redirect_target | relative_url | jsonify }});</script>
</body>
</html>
