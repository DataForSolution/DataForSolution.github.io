rights_policy:
  - code: open_access
    label: Open access
    meaning: Full reading is linked only from an authorized open-access source and the license is recorded.
  - code: public_domain
    label: Public domain
    meaning: Full reading may be linked or hosted only after public-domain status is verified for the relevant jurisdiction and edition.
  - code: publisher_free
    label: Publisher free access
    meaning: The publisher or rights holder provides a free authorized reading copy; DataForSolution links to that source.
  - code: personal_reference
    label: Personal collection reference
    meaning: A privately owned copy can be cataloged and recommended, but the file itself is not distributed or exposed to visitors.
  - code: permission_granted
    label: Permission granted
    meaning: DataForSolution may host or embed material only within the documented scope of written permission.
