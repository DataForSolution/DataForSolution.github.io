open_books:
  - title: "Medical Imaging Systems: An Introductory Guide"
    authors: Andreas Maier, Stefan Steidl, Vincent Christlein, and Joachim Hornegger, editors
    year: 2018
    subject: Medical imaging
    level: Intermediate
    rights: open_access
    rights_label: Open access
    license: Creative Commons Attribution 4.0 International (CC BY 4.0)
    source: NCBI Bookshelf / Springer
    read_url: https://www.ncbi.nlm.nih.gov/books/NBK546147/
    description: A broad introduction to medical imaging systems, from system theory and image processing through CT, MRI, X-ray imaging, emission tomography, ultrasound, and other modalities.
    best_for: Imaging professionals, students, and engineers who want a modality-spanning technical foundation.
    related_url: /projects/
    related_label: Explore medical-imaging projects

  - title: Introductory Statistics 2e
    authors: Barbara Illowsky and Susan Dean
    year: 2023
    subject: Statistics
    level: Beginner to intermediate
    rights: open_access
    rights_label: Open access
    license: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 (CC BY-NC-SA 4.0)
    source: OpenStax, Rice University
    read_url: https://openstax.org/books/introductory-statistics-2e/pages/1-introduction
    description: An openly licensed introductory statistics textbook covering descriptive statistics, probability, distributions, inference, regression, and interpretation.
    best_for: Learners building statistical foundations for data science, analytics, research, and evidence-based decision making.
    related_url: /toolkits/#evaluation
    related_label: Practice with statistics tools

