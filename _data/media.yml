        source: Amazon Web Services
        url: https://aws.amazon.com/events/reinvent/on-demand/
        format: Conference keynotes and technical sessions
        level: Intermediate to advanced
        best_for: Current AWS architecture, analytics, data, AI, security, and cloud engineering sessions
        description: AWS’s official on-demand library of re:Invent keynotes, innovation talks, breakout sessions, customer stories, and technical presentations across cloud and AI topics.
      - title: AWS Builder Events & Live Learning
        source: Amazon Web Services
        url: https://builder.aws.com/events
        format: Live events, workshops, YouTube, and streams
        level: Foundation to advanced
        best_for: Hands-on cloud learning and current service demonstrations
        description: AWS Builder Center hub for summits, workshops, training events, AWSOnAir, AWS Developers media, and other live or recorded technical learning opportunities.
      - title: What is Apache Spark?
        source: Databricks
        url: https://www.youtube.com/watch?v=p8FGC49N-zM
        format: Technical explainer
        level: Foundation
        best_for: Understanding Spark’s role in distributed data processing
        description: Apache Spark co-creator Matei Zaharia explains Spark’s purpose and how distributed data processing supports large-scale analytics and engineering workloads.

  - id: responsible-ai
    label: Responsible AI & Governance
    description: Primary-source media for AI risk, trustworthiness, governance, and regulated AI systems.
    items:
      - title: NIST AI Risk Management Framework — Explainer Video
        source: National Institute of Standards and Technology
        url: https://www.nist.gov/video/introduction-nist-ai-risk-management-framework-ai-rmf-10-explainer-video
        format: Official explainer video
        level: General to professional
        best_for: Understanding the purpose and structure of the NIST AI RMF
        description: NIST’s official introduction to the voluntary AI Risk Management Framework and its role in incorporating trustworthiness into AI design, development, use, and evaluation.
      - title: NIST AI RMF 1.0 Launch Recording
        source: National Institute of Standards and Technology
        url: https://www.nist.gov/news-events/events/2023/01/nist-ai-risk-management-framework-ai-rmf-10-launch
        format: Recorded launch event
        level: Professional
        best_for: AI governance context and stakeholder perspectives
        description: Recording of the NIST AI RMF 1.0 launch with government and stakeholder perspectives on trustworthy AI, risk management, and the framework’s intended use.
      - title: NIST AI RMF Media & Resources
        source: National Institute of Standards and Technology
        url: https://www.nist.gov/itl/ai-risk-management-framework/ai-risk-management-framework-resources
        format: Videos, framework resources, and supporting material
        level: Professional
        best_for: Continuing from explainer media into implementation resources
        description: NIST’s maintained resource page linking the AI RMF, Playbook, roadmap, crosswalks, explainer video, generative-AI profile, and related trustworthy-AI material.

