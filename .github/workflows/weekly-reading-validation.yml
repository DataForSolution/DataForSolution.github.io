name: Weekly Reading Note validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reading-note:
    name: source-rights-and-site-build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Verify latest source, rights, and note structure
        shell: bash
        run: |
          latest_note="$(find _reading_notes -maxdepth 1 -type f -name '????-??-??-*.md' | sort | tail -n 1)"
          test -n "$latest_note"
          echo "VALIDATING=$latest_note"
          ruby scripts/validate-reading-note-source.rb "$latest_note"
      - name: Run relevant JavaScript tests
        run: node --test tests/discover.test.js tests/tools-workspace.test.js
      - name: Build Jekyll site
        run: bundle exec jekyll build
      - name: Validate built site and internal references
        run: node scripts/validate-built-site.js _site
